family: deepseek_v3
model_label: DeepSeek V3
mode: stream
cases:
  TOOLCALLING.stream.4.a:
    description: Truncated stream terminates after a complete in-flight tool-call body
    ref: derived from TOOLCALLING.batch.5.a
    chunks:
    - delta_text: |-
        <｜tool▁calls▁begin｜><｜tool▁call▁begin｜>function<｜tool▁sep｜>get_weather
        ```json
        {"location": "NYC"}
        ```
    - delta_text: ''
      finish_reason: stop
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    expected:
      dynamo:
        calls: []
        normal_text: ''
      sglang:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: ''
      vllm:
        calls: []
        normal_text: |-
          <｜tool▁calls▁begin｜><｜tool▁call▁begin｜>function<｜tool▁sep｜>get_weather
          ```json
          {"location": "NYC"}
          ```
  TOOLCALLING.stream.4.b:
    description: Stream terminates mid-call body before the in-flight argument payload is complete
    ref: derived from TOOLCALLING.batch.5.c
    chunks:
    - delta_text: <｜tool▁calls▁begin｜><｜tool▁call▁begin｜>fun
    - delta_text: |-
        ction<｜tool▁sep｜>get_weather
        ```json
        {"loc
    - delta_text: ''
      finish_reason: stop
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    expected:
      dynamo:
        calls: []
        normal_text: ''
      sglang:
        calls: []
        normal_text: ''
      vllm:
        calls: []
        normal_text: |-
          <｜tool▁calls▁begin｜><｜tool▁call▁begin｜>function<｜tool▁sep｜>get_weather
          ```json
          {"loc
  TOOLCALLING.stream.4.c:
    description: Stream reaches length after a valid inner tool-call body without the required outer wrapper, followed by
      repeated close markers
    ref: derived from nemotron-ultra-preview-tool-call-leak-repro/repro_tool_call_leak.py
    chunks:
    - delta_text: |-
        <｜tool▁call▁begin｜>function<｜tool▁sep｜>get_weather
        ```json
        {"location": "NYC"}
        ```
        <｜tool▁call▁end｜>
        <｜tool▁call▁end｜>
        <｜tool▁call▁end｜>
    - delta_text: ''
      finish_reason: length
    tools:
    - name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
    expected:
      dynamo:
        calls: []
        normal_text: ''
      vllm:
        reason: vLLM preserves the orphan DeepSeek V3 inner tool-call block in normal_text; Dynamo strips it because the required outer wrapper is missing.
        calls: []
        normal_text: |-
          <｜tool▁call▁begin｜>function<｜tool▁sep｜>get_weather
          ```json
          {"location": "NYC"}
          ```
          <｜tool▁call▁end｜>
          <｜tool▁call▁end｜>
          <｜tool▁call▁end｜>
      sglang:
        reason: SGLang recovers the orphan DeepSeek V3 inner call without the required outer wrapper; Dynamo requires the wrapper and strips protocol markup.
        calls:
        - arguments:
            location: NYC
          name: get_weather
        normal_text: ''
